background {
    monitor =
    path = ~/.config/wallpapers/lock.png
    color = #282828
    blur_passes = 2
    blur_size = 4
    brightness = 0.5
    vibrancy = 0.1
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font Mono
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0%, -15%
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = $foreground
    #color = rgba(255, 255, 255, 0.6)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0%, -15%
    halign = center
    valign = top
}

label {
    monitor =
    text = Hello, $USER
    color = $foreground
    font_size = 40
    font_family = JetBrains Mono Nerd Font Mono Bold
    position = 0%, -10%
    halign = center
    valign = top
}